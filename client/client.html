<!DOCTYPE html>
<html lang="en">

<head>
  <title>Pokedex API</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    //Handles our FETCH response. This function is async because it
    //contains an await.
    const handleResponse = async (response) => {

      //Grab the content section
      const content = document.querySelector('#TestResult');

      //Based on the status code, display something
      switch (response.status) {
        case 200: //success
          content.innerHTML = `<b>Success</b>`;
          break;
        case 201: //created
          content.innerHTML = '<b>Created</b>';
          break;
        case 204: //updated (no response back from server)
          content.innerHTML = '<b>Updated (No Content)</b>';
          return;
        case 400: //bad request
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        default: //any other status code
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }

      //Parse the response to json. This works because we know the server always
      //sends back json. Await because .json() is an async function.
      const text = await response.text();
      const obj = text ? JSON.parse(text) : null;

      //If we have a message, display it.
      if (obj && obj.message) {
        content.innerHTML += `<p>${obj.message}</p>`;
      }

      // if users were included in this reponse, display them
      if (obj.pokemon) {
        content.innerHTML += `<p>${JSON.stringify(obj.pokemon)}</p>`;
      }

    };

    //Uses fetch to send a postRequest. Marksed as async because we use await
    //within it.
    const sendPost = async (nameForm) => {
      //Grab all the info from the form
      const url = nameForm.getAttribute('action');
      const method = nameForm.getAttribute('method');

      const name = nameForm.querySelector('#nameField').value;
      const age = nameForm.querySelector('#ageField').value;
      const dataType = nameForm.querySelector('#dataType').value;

      //Build a data string in the FORM-URLENCODED format.
      let formData = `name=${name}&age=${age}`;

      //If the user selected JSON, send that instead
      if (dataType === 'application/json') {
        formData = JSON.stringify({ name, age });
      }

      //Make a fetch request and await a response
      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': dataType,
          'Content-Length': formData.length,
          'Accept': 'application/json',
        },
        body: formData,
      });

      //Once we have a response, handle it.
      handleResponse(response);
    };


    const sendGetOrHead = async (requestForm, endpoint) => {

      // create an object with the search parameters
      const params = new URLSearchParams(requestForm);
      const urlWithParams = `${endpoint}?${params.toString()}`;

      // send request
      formData = JSON.stringify({ requestForm });
      const response = await fetch(urlWithParams, {
        method: requestForm.get('method'),
        headers: {
          'Content-Type': 'application/json',
          'Content-Length': formData.length,
          'Accept': 'application/json',
        },
      });

      handleResponse(response);
    }

    //Init function is called when window.onload runs (set below).
    const init = () => {

      // subscribe to anysubmit event across the entire document
      document.addEventListener('submit', function (event) {
        // check if the event is from an endpoint form
        const form = event.target;

        if (form.hasAttribute('data-endpoint')) {
          event.preventDefault();

          // get necessary request parameters
          const endpoint = form.getAttribute('data-endpoint');

          const formData = new FormData(form);
          const selectedMethod = formData.get('method');

          console.log(`Sending ${formData} request to ${formData.method}`);

          if (selectedMethod == "POST") {
            console.log("POST");

          }
          else {
            sendGetOrHead(formData, endpoint);
          }

          return false;
        }
      });


    };

    //When the window loads, run init.
    window.onload = init;
  </script>
</head>

<body>
  <div id="mainContent">
    <h1>Test Application</h1>

    <div class="content" style="display:block">
      <div class="content-box">
        <h3>getPokemonByNum</h3>
        <form data-method="GET" data-endpoint="/pokedex/getPokemonByNum">
          <label>
            <input type="radio" name="method" value="GET" checked>
            " GET"
          </label>
          <input type="radio" name="method" value="HEAD">
          " HEAD"
          </label>
          <label>Pokedex Num: <input type="number" name="pokedexNum" min="1" max="151"></label><br>

          <button type="submit">Send Request</button>
        </form>
        <pre class="result"></pre>

      </div>
    </div>
    <div class="content" style="display:block">
      <div class="content-box">
        <h3>Endpoint test</h3>
        <form data-method="GET" data-endpoint="/pokedex/getFilmTitles">
          <label>
            <input type="radio" name="method" value="GET" checked>
            " GET"
          </label>
          <input type="radio" name="method" value="HEAD">
          " HEAD"
          </label>
          <button type="submit">Send Request</button>
        </form>
        <pre class="result"></pre>

      </div>
    </div>

    <pre id="TestResult">Here</pre>


  </div>


</body>

</html>
